```yaml
name: Backend CI

on:
  push:
    paths:
      - "Backend/**"
      - ".github/workflows/backend.yml"

jobs:
  build:
    runs-on: node-runner

    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Verify backend starts
        run: node --version
```
